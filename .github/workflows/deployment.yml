name: Nivabit CI/CD workflow

on:
  push:
    branches:
      - version2
  pull_request:
    branches:
      - version2

jobs:
  integration:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Cache Bun Dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install Dependencies
        run: bun install --frozen-lockfile

      - name: Verify Build
        run: bun --bun ./node_modules/.bin/vite build
        env:
          NODE_ENV: production
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          CONTACT_EMAIL: ${{ secrets.CONTACT_EMAIL }}
          PUBLIC_SITE_URL: ${{ secrets.PUBLIC_SITE_URL }}

  deploy:
    name: Build, Push to GHCR & Deploy
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/version2'
    needs:
      - integration
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set lowercase image name
        id: meta
        run: |
          IMAGE_LOWER=$(echo "ghcr.io/${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          PKG_LOWER=$(echo "${{ github.event.repository.name }}" | tr '[:upper:]' '[:lower:]')
          echo "image=${IMAGE_LOWER}" >> "$GITHUB_OUTPUT"
          echo "package=${PKG_LOWER}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          target: runner
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}:latest
            ${{ steps.meta.outputs.image }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Upload docker-compose.prod.yml to Server
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USERNAME }}
          password: ${{ secrets.SERVER_PASSWORD }}
          source: 'docker-compose.prod.yml'
          target: '~/public_html'

      - name: Pull Image and Restart Container on Server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USERNAME }}
          password: ${{ secrets.SERVER_PASSWORD }}
          script: |
            set -e
            cd ~/public_html
            mkdir -p uploads

            # Write production .env
            cat > .env << 'EOF'
            IMAGE_NAME=${{ steps.meta.outputs.image }}:${{ github.sha }}
            NODE_ENV=production
            PORT=3000
            ORIGIN=${{ secrets.PUBLIC_SITE_URL || 'https://nivabit.com' }}
            DATABASE_URL=${{ secrets.DATABASE_URL }}
            JWT_SECRET=${{ secrets.JWT_SECRET }}
            ACCESS_TOKEN_SECRET=${{ secrets.JWT_SECRET }}
            SMTP_HOST=${{ secrets.SMTP_HOST }}
            SMTP_PORT=${{ secrets.SMTP_PORT }}
            SMTP_USERNAME=${{ secrets.SMTP_USERNAME }}
            SMTP_PASSWORD=${{ secrets.SMTP_PASSWORD }}
            CONTACT_EMAIL=${{ secrets.CONTACT_EMAIL }}
            PUBLIC_SITE_URL=${{ secrets.PUBLIC_SITE_URL }}
            EOF

            # Use docker directly if user is in docker group, otherwise fall back to sudo
            run_docker() {
              if docker info >/dev/null 2>&1; then
                docker "$@"
              else
                echo "${{ secrets.SERVER_PASSWORD }}" | sudo -S docker "$@"
              fi
            }

            # Log in to GHCR on server to pull the image
            if docker info >/dev/null 2>&1; then
              echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
            else
              echo "${{ secrets.SERVER_PASSWORD }}" | sudo -S sh -c 'echo "$1" | docker login ghcr.io -u "$2" --password-stdin' _ "${{ secrets.GITHUB_TOKEN }}" "${{ github.actor }}"
            fi

            # Pull and start the new image
            export IMAGE_NAME="${{ steps.meta.outputs.image }}:${{ github.sha }}"
            run_docker compose -f docker-compose.prod.yml pull
            run_docker compose -f docker-compose.prod.yml up -d --remove-orphans

            # Clean up all unused/old images on the server (keeps currently running image)
            run_docker image prune -af || true

            # Verify container health & HTTP response on port 3000
            sleep 5
            run_docker ps --filter "name=nivabit-prod"
            run_docker logs --tail 30 nivabit-prod
            curl -fsS http://127.0.0.1:3000/ > /dev/null
            echo "Deployment verified: http://127.0.0.1:3000/ returned 200 OK"

      - name: Clean up old GHCR image versions
        uses: actions/delete-package-versions@v5
        continue-on-error: true
        with:
          package-name: ${{ steps.meta.outputs.package }}
          package-type: container
          min-versions-to-keep: 1
          delete-only-untagged-versions: false
