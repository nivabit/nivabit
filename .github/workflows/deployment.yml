name: Nivabit CI/CD workflow

on:
  push:
    branches:
      - version2
  pull_request:
    branches:
      - version2

jobs:
  integration:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Cache Bun Dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install Dependencies
        run: bun install --frozen-lockfile

      - name: Verify Build
        run: bun --bun ./node_modules/.bin/vite build
        env:
          NODE_ENV: production
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          CONTACT_EMAIL: ${{ secrets.CONTACT_EMAIL }}
          PUBLIC_SITE_URL: ${{ secrets.PUBLIC_SITE_URL }}

  deploy:
    name: Nivabit Docker Deployment
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/version2'
    needs:
      - integration

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Create Deployment Bundle
        run: |
          cat > .env.prod << EOF
          NODE_ENV=production
          PORT=3000
          ORIGIN=${{ secrets.PUBLIC_SITE_URL || 'https://nivabit.com' }}
          DATABASE_URL=${{ secrets.DATABASE_URL }}
          JWT_SECRET=${{ secrets.JWT_SECRET }}
          ACCESS_TOKEN_SECRET=${{ secrets.JWT_SECRET }}
          SMTP_HOST=${{ secrets.SMTP_HOST }}
          SMTP_PORT=${{ secrets.SMTP_PORT }}
          SMTP_USERNAME=${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD=${{ secrets.SMTP_PASSWORD }}
          CONTACT_EMAIL=${{ secrets.CONTACT_EMAIL }}
          PUBLIC_SITE_URL=${{ secrets.PUBLIC_SITE_URL }}
          EOF

          tar -czf nivabit-docker.tar.gz \
            --exclude='.git' \
            --exclude='node_modules' \
            --exclude='.svelte-kit' \
            --exclude='build' \
            --exclude='.env' \
            --exclude='nivabit-docker.tar.gz' \
            .

      - name: Upload Bundle to Server
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USERNAME }}
          password: ${{ secrets.SERVER_PASSWORD }}
          source: 'nivabit-docker.tar.gz'
          target: '~/public_html'

      - name: Build and Start Docker Container
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USERNAME }}
          password: ${{ secrets.SERVER_PASSWORD }}
          script: |
            set -e
            cd ~/public_html

            # Extract fresh source & production env
            tar -xzf nivabit-docker.tar.gz
            rm -f nivabit-docker.tar.gz
            mv .env.prod .env
            mkdir -p uploads

            # Stop legacy PM2 process so port 3000 is free for Docker
            if command -v pm2 >/dev/null 2>&1; then
              pm2 delete "${{ secrets.SERVICE_NAME }}" || true
              pm2 delete nivabit || true
              pm2 save || true
            fi

            # Build and start the production Docker container
            docker compose -f docker-compose.prod.yml up -d --build --remove-orphans

            # Verify container health & HTTP response on port 3000
            sleep 5
            docker ps --filter "name=nivabit-prod"
            docker logs --tail 30 nivabit-prod
            curl -fsS http://127.0.0.1:3000/ > /dev/null
            echo "Deployment verified: http://127.0.0.1:3000/ returned 200 OK"
