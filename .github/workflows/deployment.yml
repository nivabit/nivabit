name: Nivabit CI/CD workflow

on:
  push:
    branches:
      - version2
  pull_request:
    branches:
      - version2

jobs:
  integration:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Cache Bun Dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install Dependencies
        run: bun install --frozen-lockfile

      - name: Set Environment Variables
        run: |
          echo "NODE_ENV=production" >> $GITHUB_ENV
          echo "DATABASE_URL=${{ secrets.DATABASE_URL }}" >> $GITHUB_ENV
          echo "JWT_SECRET=${{ secrets.JWT_SECRET }}" >> $GITHUB_ENV
          echo "SMTP_HOST=${{ secrets.SMTP_HOST }}" >> $GITHUB_ENV
          echo "SMTP_PORT=${{ secrets.SMTP_PORT }}" >> $GITHUB_ENV
          echo "SMTP_USERNAME=${{ secrets.SMTP_USERNAME }}" >> $GITHUB_ENV
          echo "SMTP_PASSWORD=${{ secrets.SMTP_PASSWORD }}" >> $GITHUB_ENV
          echo "CONTACT_EMAIL=${{ secrets.CONTACT_EMAIL }}" >> $GITHUB_ENV

      - name: Sync Database Schema
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          if [ -f "./drizzle/meta/_journal.json" ]; then
            bunx drizzle-kit migrate
          else
            bunx drizzle-kit push --force
          fi

      # - name: Run Linting
      #   run: bun run lint

      # - name: Run Type Checking
      #   run: bun run check

      # - name: Run Unit Tests
      #   run: bun run test:unit

      # - name: Run E2E Tests
      #   run: bun run test:e2e

  deploy:
    name: Nivabit Frontend Deployment
    runs-on: ubuntu-latest
    needs:
      - integration

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Cache Bun Dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install Dependencies
        run: bun install --frozen-lockfile

      - name: Build Application
        run: bun --bun ./node_modules/.bin/vite build
        env:
          NODE_ENV: production
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          CONTACT_EMAIL: ${{ secrets.CONTACT_EMAIL }}
          PUBLIC_SITE_URL: ${{ secrets.PUBLIC_SITE_URL }}

      - name: Create deployment package
        run: |
          mkdir -p deployment/src/lib/server
          # Copy the built application
          cp -r build deployment/
          cp -r static deployment/
          cp drizzle.config.ts deployment/
          cp -r src/lib/server/db deployment/src/lib/server/
          if [ -d "drizzle" ]; then
            cp -r drizzle deployment/
          fi

          # Create .env file
          cat > deployment/.env << EOF
          NODE_ENV=production
          DATABASE_URL=${{ secrets.DATABASE_URL }}
          JWT_SECRET=${{ secrets.JWT_SECRET }}
          SMTP_HOST=${{ secrets.SMTP_HOST }}
          SMTP_PORT=${{ secrets.SMTP_PORT }}
          SMTP_USERNAME=${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD=${{ secrets.SMTP_PASSWORD }}
          CONTACT_EMAIL=${{ secrets.CONTACT_EMAIL }}
          PUBLIC_SITE_URL=${{ secrets.PUBLIC_SITE_URL }}
          PORT=3000
          EOF

          # Create package.json for production
          cat > deployment/package.json << 'EOL'
          {
            "name": "nivabit-production",
            "version": "1.0.0",
            "type": "module",
            "scripts": {
              "start": "bun build/index.js",
              "db:push": "drizzle-kit push",
              "db:migrate": "drizzle-kit migrate",
              "db:seed": "bun src/lib/server/db/seed.ts"
            },
            "dependencies": {
              "argon2": "^0.44.0",
              "bcryptjs": "^3.0.2",
              "dotenv": "^17.2.3",
              "drizzle-kit": "^0.31.1",
              "drizzle-orm": "^0.44.2",
              "handlebars": "^4.7.10",
              "jsonwebtoken": "^9.0.2",
              "jwt-decode": "^4.0.0",
              "mjml": "^4.15.3",
              "nodemailer": "^7.0.5",
              "postgres": "^3.4.5",
              "uuid": "^11.1.0",
              "valibot": "^1.5.0"
            }
          }
          EOL

          tar -czf nivabit-frontend.tar.gz -C deployment .

      - name: Deploy to Server
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USERNAME }}
          password: ${{ secrets.SERVER_PASSWORD }}
          source: 'nivabit-frontend.tar.gz'
          target: '~/public_html'

      - name: Set Permissions and Restart Application
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USERNAME }}
          password: ${{ secrets.SERVER_PASSWORD }}
          script: |
            export PATH="$HOME/.bun/bin:$PATH"
            if ! command -v bun >/dev/null 2>&1; then
              curl -fsSL https://bun.sh/install | bash
              export PATH="$HOME/.bun/bin:$PATH"
            fi

            cd ~/public_html

            # Extract the deployment package
            tar -xzf nivabit-frontend.tar.gz
            rm nivabit-frontend.tar.gz

            # Install production dependencies with Bun
            bun install --production

            # Sync Drizzle database schema
            if [ -f "./drizzle/meta/_journal.json" ]; then
              bunx drizzle-kit migrate
            else
              bunx drizzle-kit push --force
            fi

            # Create PM2 config file
            cat > ecosystem.config.js << 'EOL'
            module.exports = {
              apps: [{
                name: '${{ secrets.SERVICE_NAME }}',
                script: 'build/index.js',
                interpreter: 'bun',
                instances: 1,
                autorestart: true,
                watch: false,
                max_memory_restart: '1G',
                env_file: './.env',
                env: {
                  NODE_ENV: 'production',
                  PORT: 3000
                }
              }]
            };
            EOL

            # Check if PM2 app exists and reload, otherwise start fresh
            if pm2 list | grep -q "nivabit"; then
              echo "Application exists, reloading..."
              pm2 reload nivabit
            else
              echo "Application doesn't exist, starting fresh..."
              pm2 start ecosystem.config.js
            fi

            # Save PM2 configuration
            pm2 save

            # Verify the app is running
            pm2 list
