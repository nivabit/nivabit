name: Nivabit CI/CD workflow

on:
  push:
    branches:
      - version2
  pull_request:
    branches:
      - version2

jobs:
  integration:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Cache Dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.npm
            node_modules
            .next/cache
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Install Dependencies
        run: npm ci

      - name: Set Environment Variables
        run: |
          echo "NODE_ENV=production" >> $GITHUB_ENV
          echo "DATABASE_URL=${{ secrets.DATABASE_URL }}" >> $GITHUB_ENV
          echo "JWT_SECRET=${{ secrets.JWT_SECRET }}" >> $GITHUB_ENV
          echo "SMTP_HOST=${{ secrets.SMTP_HOST }}" >> $GITHUB_ENV
          echo "SMTP_PORT=${{ secrets.SMTP_PORT }}" >> $GITHUB_ENV
          echo "SMTP_USERNAME=${{ secrets.SMTP_USERNAME }}" >> $GITHUB_ENV
          echo "SMTP_PASSWORD=${{ secrets.SMTP_PASSWORD }}" >> $GITHUB_ENV
          echo "CONTACT_EMAIL=${{ secrets.CONTACT_EMAIL }}" >> $GITHUB_ENV

      - name: Run Database Migrations
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          npx prisma generate
          npx prisma migrate deploy

      # - name: Run Linting
      #   run: npm run lint

      # - name: Run Type Checking
      #   run: npm run check

      # - name: Run Unit Tests
      #   run: npm run test:unit

      # - name: Run E2E Tests
      #   run: npm run test:e2e

  deploy:
    name: Nivabit Frontend Deployment
    runs-on: ubuntu-latest
    needs:
      - integration

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Application
        run: npm run build
        env:
          NODE_ENV: production
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          CONTACT_EMAIL: ${{ secrets.CONTACT_EMAIL }}
          PUBLIC_SITE_URL: ${{ secrets.PUBLIC_SITE_URL }}

      - name: Create deployment package
        run: |
          mkdir -p deployment
          # Copy the built application
          cp -r build deployment/
          cp -r static deployment/
          cp package.json deployment/
          cp package-lock.json deployment/

          # Copy Prisma schema and migrations
          cp -r prisma deployment/

          # Create .env file
          cat > deployment/.env << EOF
          NODE_ENV=production
          DATABASE_URL=${{ secrets.DATABASE_URL }}
          JWT_SECRET=${{ secrets.JWT_SECRET }}
          SMTP_HOST=${{ secrets.SMTP_HOST }}
          SMTP_PORT=${{ secrets.SMTP_PORT }}
          SMTP_USERNAME=${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD=${{ secrets.SMTP_PASSWORD }}
          CONTACT_EMAIL=${{ secrets.CONTACT_EMAIL }}
          PUBLIC_SITE_URL=${{ secrets.PUBLIC_SITE_URL }}
          PORT=3000
          EOF

          # Create package.json for production
          cat > deployment/package.json << 'EOL'
          {
            "name": "nivabit-production",
            "version": "1.0.0",
            "type": "module",
            "scripts": {
              "start": "node build/index.js",
              "db:migrate": "prisma migrate deploy",
              "db:generate": "prisma generate"
            },
            "dependencies": {
              "@prisma/client": "^6.15.0",
              "argon2": "^0.44.0",
              "bcryptjs": "^3.0.2",
              "jsonwebtoken": "^9.0.2",
              "jwt-decode": "^4.0.0",
              "nodemailer": "^7.0.5",
              "prisma": "^6.15.0",
              "uuid": "^11.1.0",
              "zod": "^3.25.76"
            }
          }
          EOL

          tar -czf nivabit-frontend.tar.gz -C deployment .

      - name: Deploy to Server
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USERNAME }}
          password: ${{ secrets.SERVER_PASSWORD }}
          source: 'nivabit-frontend.tar.gz'
          target: '~/nivabit/public_html'

      - name: Set Permissions and Restart Application
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USERNAME }}
          password: ${{ secrets.SERVER_PASSWORD }}
          script: |
            cd ~/nivabit/public_html

            # Extract the deployment package
            tar -xzf nivabit-frontend.tar.gz
            rm nivabit-frontend.tar.gz

            # Install production dependencies
            npm ci --only=production

            # Generate Prisma client
            npx prisma generate

            # Run database migrations
            npx prisma migrate deploy

            # Create PM2 config file
            cat > ecosystem.config.js << 'EOL'
            module.exports = {
              apps: [{
                name: '${{ secrets.SERVICE_NAME }}',
                script: 'build/index.js',
                instances: 1,
                autorestart: true,
                watch: false,
                max_memory_restart: '1G',
                env_file: './.env',
                env: {
                  NODE_ENV: 'production',
                  PORT: 3000
                }
              }]
            };
            EOL

            # Check if PM2 app exists and reload, otherwise start fresh
            if pm2 list | grep -q "${{ secrets.SERVICE_NAME }}"; then
              echo "Application exists, reloading..."
              pm2 reload ${{ secrets.SERVICE_NAME }}
            else
              echo "Application doesn't exist, starting fresh..."
              pm2 start ecosystem.config.js
            fi

            # Save PM2 configuration
            pm2 save

            # Verify the app is running
            pm2 list
